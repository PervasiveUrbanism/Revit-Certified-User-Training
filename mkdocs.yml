site_name: Mossessian Architecture - Revit Training
site_description: In-house support page for Revit user training, schedules, resources, and lesson notes.
site_url: https://pervasiveurbanism.github.io/Revit-Certified-User-Training/
repo_url: https://github.com/PervasiveUrbanism/Revit-Certified-User-Training
repo_name: PervasiveUrbanism/Revit-Certified-User-Training

theme:
  name: shadcn
  custom_dir: overrides
  show_title: true
  show_stargazers: false
  show_datetime: true
  favicon: assets/favicon.svg
  accent: "oklch(62% 0.14 190)"

nav:
  - Home: index.md
  - Schedule: schedule.md
  - Sessions:
      - S01 - Intro: session-01-getting-started.md
      - S02 - Grids: session-02-levels-grids.md
      - S03 - Walls: session-03-walls-doors-windows.md
      - S04 - Floors: session-04-floors-roofs-ceilings.md
      - S05 - Views: session-05-views-visibility-graphics.md
      - S06 - Annotation: session-06-annotation-dimensions.md
      - S07 - Drafting: session-07-drafting-detailing.md
      - S08 - Sections: session-08-sections-elevations-callouts.md
      - S09 - Sheets: session-09-sheets-printing.md
      - S10 - Families: session-10-components-families.md
      - S11 - Editing: session-11-family-editing.md
      - S12 - Schedules: session-12-schedules-quantities.md
      - S13 - Rooms: session-13-rooms-areas-tags.md
      - S14 - Links: session-14-linked-models-coordination.md
      - S15 - Sharing: session-15-worksharing-collaboration.md
      - S16 - Review: session-16-troubleshooting-mock-review.md
  - Mock Test:
      - Mock Up 1: mock-up-1.md
      - Mock Up 2: mock-up-2.md
  - Resources: resources.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true

plugins:
  - search

exclude_docs: |
  _drafts/
